<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                    </button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-success text-white text-center">
                    <h3>Student Registration</h3>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Student Name</label>
                            <input type="text" class="form-control"
                                   name="student_name"
                                   placeholder="Enter Student Name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Roll Number</label>
                            <input type="text" class="form-control"
                                   name="rollno"
                                   placeholder="Enter Roll Number"
                                   required>
                        </div>

                         <div class="mb-3">
                            <label class="form-label">Student Number</label>
                            <input type="tel" class="form-control"
                                   name="phone"
                                   placeholder="Enter Student Number"
                                   required>
                        </div>

                        <select class="form-select mb-3" name="department" required>
                            <option value="">Select Department</option>
                            <option value="AI">AI</option>
                            <option value="CSE">CSE</option>
                            <option value="ECE">ECE</option>
                            <option value="EEE">EEE</option>
                            <option value="MECH">MECH</option>
                            <option value="CIVIL">CIVIL</option>
                        </select>

                        <select class="form-select mb-3" name="gender" required>
                          <option value="">Select Gender</option>
                          <option value="Male">Male</option>
                          <option value="Female">Female</option>
                          <option value="Other">Other</option>
                        </select>

                        <select class="form-select mb-3" name="blood_group" required>
                            <option value="">Select Blood Group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>

                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea class="form-control"
                                      name="address"
                                      rows="3"
                                      placeholder="Enter Address"
                                      required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Parent Number</label>
                            <input type="tel" class="form-control"
                                   name="parent"
                                   placeholder="Enter Parent Number"
                                   required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">
                                Add Student
                            </button>
                            <a href="/dashboard" class="btn btn-secondary">
                                Back to Dashboard
                            </a>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
