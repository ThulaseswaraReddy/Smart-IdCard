<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                    </button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark text-center">
                    <h3>Edit Student Details</h3>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Student Name</label>
                            <input type="text"
                                   class="form-control"
                                   name="student_name"
                                   value="{{ student.student_name }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Roll Number</label>
                            <input type="text"
                                   class="form-control"
                                   name="rollno"
                                   value="{{ student.rollno }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Student Number</label>
                            <input type="tel"
                                   class="form-control"
                                   name="phone"
                                   value="{{ student.phone }}"
                                   required>
                        </div>

                        <select class="form-select mb-3" name="department" required>
                          <option value="AI" {% if student.department=="AI" %}selected{% endif %}>AI</option>
                          <option value="CSE" {% if student.department=="CSE" %}selected{% endif %}>CSE</option>
                          <option value="ECE" {% if student.department=="ECE" %}selected{% endif %}>ECE</option>
                          <option value="EEE" {% if student.department=="EEE" %}selected{% endif %}>EEE</option>
                          <option value="MECH" {% if student.department=="MECH" %}selected{% endif %}>MECH</option>
                          <option value="CIVIL" {% if student.department=="CIVIL" %}selected{% endif %}>CIVIL</option>
                        </select>
            
                            <select class="form-select mb-3" name="gender" required>
                              <option value="Male" {% if student.gender=="Male" %}selected{% endif %}>Male</option>
                              <option value="Female" {% if student.gender=="Female" %}selected{% endif %}>Female</option>
                              <option value="Other" {% if student.gender=="Other" %}selected{% endif %}>Other</option>
                            </select>
                        
                          <select class="form-select mb-3" name="blood_group" required>
                              <option value="A+" {% if student.blood_group=="A+" %}selected{% endif %}>A+</option>
                              <option value="A-" {% if student.blood_group=="A-" %}selected{% endif %}>A-</option>
                              <option value="B+" {% if student.blood_group=="B+" %}selected{% endif %}>B+</option>
                              <option value="B-" {% if student.blood_group=="B-" %}selected{% endif %}>B-</option>
                              <option value="AB+" {% if student.blood_group=="AB+" %}selected{% endif %}>AB+</option>
                              <option value="AB-" {% if student.blood_group=="AB-" %}selected{% endif %}>AB-</option>
                              <option value="O+" {% if student.blood_group=="O+" %}selected{% endif %}>O+</option>
                              <option value="O-" {% if student.blood_group=="O-" %}selected{% endif %}>O-</option>
                          </select>
                        
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea
                                class="form-control"
                                name="address"
                                rows="3"
                                required>{{ student.address }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Parent Number</label>
                            <input type="tel"
                                   class="form-control"
                                   name="parent"
                                   value="{{ student.parentnumber }}"
                                   required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning">
                                Update Student
                            </button>
                            <a href="/students" class="btn btn-secondary">
                                Back to Students
                            </a>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
